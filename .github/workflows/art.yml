name: Draw the game art (free, open-source AI)

# Runs on GitHub's own computers, many at once. Draws every character (5 expressions)
# and every background with open-source Stable Diffusion XL (DreamShaper XL Turbo),
# removes character backgrounds, commits everything into img/, then rebuilds the
# website. (Build the Android app by hand afterwards.) Pictures that already exist are kept.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these ids (comma separated). Empty = everything'
        default: ''
      phases:
        description: '1 = characters, 2 = backgrounds, 3 = extra expressions'
        default: '1,2,3'
      shards:
        description: 'How many computers to use at once (1-16)'
        default: '16'
      redo:
        description: 'Redraw pictures that already exist (yes/no)'
        default: 'no'
      salt:
        description: 'Any word, to get a different drawing when redrawing (empty = same as before)'
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: art
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: |
          n="${{ github.event.inputs.shards || '16' }}"
          python3 -c "import json,sys; n=max(1,min(16,int(sys.argv[1]))); print('shards='+json.dumps(list(range(n))))" "$n" >> "$GITHUB_OUTPUT"

  draw:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache the AI models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.u2net
            ~/.rembg
          key: art-models-xl-v1
      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers==0.31.0 transformers==4.46.3 accelerate==1.1.1 peft==0.13.2 safetensors pillow "rembg==2.0.59" onnxruntime==1.19.2 "numpy<2"
      - name: Start over (only if asked)
        if: ${{ github.event.inputs.redo == 'yes' }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            for id in $(echo "${{ github.event.inputs.only }}" | tr ',' ' '); do rm -f img/chars/$id-* img/bg/$id.*; done
          else rm -rf img/chars img/bg; fi
      - name: Draw
        env:
          ART_OUT: out
          ART_MINUTES: '320'
          ART_ONLY: ${{ github.event.inputs.only }}
          ART_SALT: ${{ github.event.inputs.salt }}
          ART_PHASES: ${{ github.event.inputs.phases || '1,2,3' }}
          ART_SHARD: ${{ matrix.shard }}
          ART_SHARDS: ${{ github.event.inputs.shards || '16' }}
        run: |
          mkdir -p out/chars out/bg
          python tools/art/generate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-${{ matrix.shard }}
          path: out
          if-no-files-found: ignore
          retention-days: 1

  save:
    needs: draw
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: art-*
          path: out
          merge-multiple: true
      - name: Put the pictures in img/ and commit
        run: |
          mkdir -p img/chars img/bg
          cp -f out/chars/*.png img/chars/ 2>/dev/null || true
          cp -f out/bg/*.jpg img/bg/ 2>/dev/null || true
          # PNG -> WebP (about a tenth of the size) and the picture list the game reads
          python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || python3 -m pip install --quiet pillow || true
          python3 tools/art/finish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then echo "No new pictures."; exit 0; fi
          git commit -m "Art: $(ls img/chars/*.webp img/chars/*.png 2>/dev/null | wc -l) character pictures, $(ls img/bg | wc -l) backgrounds"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Rebuild the website with the new art (the Android app is built by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}" || true

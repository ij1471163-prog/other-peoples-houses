name: Build Android app (APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release (the in-game download link)

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Optional. Without these, you still get an installable APK (debug-signed) and an UNSIGNED .aab.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 needs Node 22 and JDK 21. Its Android template targets SDK 36 (Google Play's requirement since Aug 2026).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # GitHub's Ubuntu runners already include the Android SDK; just accept its licences.
      - name: Android SDK licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Copy the game into www/
        run: |
          rm -rf www && mkdir www
          cp -r index.html css js www/
          if [ -d img ]; then cp -r img www/; fi

      - name: Install Capacitor (pinned versions)
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@8.5.2 @capacitor/cli@8.5.2 @capacitor/android@8.5.2 @capacitor/assets@3.0.5

      - name: Create the Android project
        run: npx cap add android

      - name: App icon and splash screen (from assets/)
        run: npx capacitor-assets generate --android || echo "::warning::Icon generation failed; the default icon will be used."

      - name: Version number and landscape orientation
        run: |
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK, release APK and release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Collect files (and sign them if a keystore secret exists)
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/OtherPeoplesHouses.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/OtherPeoplesHouses.aab
          if [ -n "$KEYSTORE_BASE64" ]; then
            for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              [ -n "${!v}" ] || { echo "::error::KEYSTORE_BASE64 is set but secret $v is missing"; exit 1; }
            done
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out dist/OtherPeoplesHouses.apk "$RUNNER_TEMP/aligned.apk"
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" dist/OtherPeoplesHouses.aab "$KEY_ALIAS"
            echo "Signed with your upload key."
          else
            echo "No keystore secret: APK is debug-signed (installable for testing), AAB is unsigned (Play will reject it)."
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: OtherPeoplesHouses-android
          path: dist/*
          retention-days: 30

      - name: Publish a release (this is what the in-game "Download" button opens)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Other People's Houses 1.0.${{ github.run_number }}
          files: |
            dist/OtherPeoplesHouses.apk
            dist/OtherPeoplesHouses.aab
          make_latest: true

name: Trial - characters inside rooms (free, open-source AI)

# Draws a few "character doing something in a room" pictures to look at.
# Nothing is committed to the game: the pictures are a download (scenes-*).

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: 'Scene ids (comma separated). Empty = all five'
        default: ''

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        run: |
          s="${{ github.event.inputs.scenes }}"
          [ -z "$s" ] && s="leo-boathouse-eat,leo-boathouse-draw,margaret-marg_kitchen-tea,evelyn-lh_living-read,victor-hotel_suite-drink"
          python3 -c "import json,sys; print('list='+json.dumps([x for x in sys.argv[1].split(',') if x]))" "$s" >> "$GITHUB_OUTPUT"
  draw:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space for the model
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache the AI models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: scenes-models-v2
      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install diffusers==0.31.0 transformers==4.46.3 accelerate==1.1.1 peft==0.13.2 safetensors pillow "numpy<2"
      - name: Draw
        env:
          SCENE: ${{ matrix.scene }}
        run: python tools/art/scenes.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scenes-${{ matrix.scene }}
          path: out/scenes
          if-no-files-found: ignore
          retention-days: 3
  # the pictures go to a separate branch (scenes-trial), never into the game on main
  save:
    needs: draw
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: scenes-*
          path: out
          merge-multiple: true
      - name: Push to the scenes-trial branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir t && cd t && git init -q && git checkout -q -b scenes-trial
          cp -r ../out/. . 2>/dev/null || true
          for f in *.jpg; do [ -f "$f" ] && python3 -c "from PIL import Image; import sys; im=Image.open(sys.argv[1]); im.thumbnail((960,960)); im.save(sys.argv[1], quality=82)" "$f" 2>/dev/null || true; done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Scenes trial ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" scenes-trial
